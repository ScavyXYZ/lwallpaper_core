name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Core / ${{ matrix.configuration }}
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout source and LFS dependencies
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true
          persist-credentials: false
      - name: Verify dependency objects
        run: git lfs fsck
      - name: Prepare verified FFmpeg CLI
        run: ./scripts/ci/prepare-ffmpeg.ps1 -Destination "$env:RUNNER_TEMP/ffmpeg"
      - name: Configure (no Qt)
        run: ./scripts/ci/configure.ps1 -Kind Core -Root .
      - name: Build
        run: cmake --build build --config "${{ matrix.configuration }}" --parallel 2
      - name: Test
        # Hosted runners have no guaranteed hardware GPU. Private-window GPU
        # smoke tests remain available locally and on GPU-equipped machines.
        run: >-
          ctest --test-dir build -C "${{ matrix.configuration }}"
          --output-on-failure --no-tests=error
          --output-junit "$env:GITHUB_WORKSPACE/build/test-results.xml"
          -E "^d3d11_gpu_smoke$"
      - name: Stage library, headers and runtime
        run: >-
          ./scripts/ci/stage-artifacts.ps1 -Kind Core
          -Configuration "${{ matrix.configuration }}" -Root .
      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: core-windows-x64-${{ matrix.configuration }}
          path: out/ci-package/${{ matrix.configuration }}/
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and configuration diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: core-diagnostics-${{ matrix.configuration }}
          path: |
            build/test-results.xml
            build/Testing/Temporary/
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 14
